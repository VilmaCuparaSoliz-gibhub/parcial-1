<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIAF - Unidad Administrativa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="estiloo.css">
</head>
<body>
  <div class="contenedor-principal">
    <p>UNIDAD ADMINISTRATIVA </p>

    <div class="cabecera-seccion">
      <h2>UNIDAD ADMINISTRATIVAS</h2>
    </div>

    <h2 class="subtitulo">-</h2>

    <div class="formulario-datos">
      <div class="fila-dato">
        <label>Unidad Administrativa:</label>
        <span class="valor-dato">025</span>
      </div>
      <div class="fila-dato">
        <label>Ciudad:</label>
        <span class="valor-dato">LA PAZ</span>
      </div>
      <div class="fila-dato">
        <label>Descripción:</label>
        <span class="valor-dato">GACETA OFICIAL DE BOLIVIA</span>
      </div>
    </div>

    <div class="botones-accion">
      <button class="btn-primario"><i class="fas fa-save"></i> Grabar</button>
      <button class="btn-secundario"><i class="fas fa-sign-out-alt"></i> Salir</button>
    </div>

    <div class="mensaje-exito">
      <i class="fas fa-check-circle"></i>
      <span>Los datos fueron ingresados correctamente</span>
    </div>

    <div class="contenedor-aceptar">
      <button class="btn-aceptar">Aceptar</button>
    </div>

    <div class="paso-indicador">
      <span class="paso-activo">PASO 1</span>
      <span class="paso-inactivo">PASO 2</span>
    </div>

  </div>
</body>
</html>
