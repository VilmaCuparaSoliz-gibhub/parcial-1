<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIAF - Seguridad</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="estill.css">
</head>
<body>
  <div class="contenedor-principal">
    
    <div class="cabecera-seccion">
      <p>SEGURIDAD</p>
    </div>
    <h1 class="subtitulo">SEGURIDAD</h1>

    <div class="formulario-datos">
      <div class="fila-dato">
        <label>USUARIO:</label>
        <span class="valor-dato">admin</span>
      </div>
      <div class="fila-dato">
        <label>CONTRASEÑA ASIGNADA:</label>
        <span class="valor-dato">••••••••</span>
      </div>
      <div class="fila-dato">
        <label>NOMBRE COMPLETO:</label>
        <span class="valor-dato">administrador</span>
      </div>
      <div class="fila-dato">
        <label>DESCRIPCIÓN:</label>
        <span class="valor-dato"></span>
      </div>
    </div>

    
    <div class="tipo-usuario">
      <label class="radio-opcion">
        <input type="radio" name="tipo" checked> Operador
      </label>
      <label class="radio-opcion">
        <input type="radio" name="tipo"> Administrador
      </label>
    </div>

    
    <div class="botones-navegacion">
      <button class="btn-nav"><i class="fas fa-fast-backward"></i> Primero</button>
      <button class="btn-nav"><i class="fas fa-step-backward"></i> Anterior</button>
      <button class="btn-nav"><i class="fas fa-step-forward"></i> Siguiente</button>
      <button class="btn-nav"><i class="fas fa-fast-forward"></i> Ultimo</button>
      <button class="btn-nav"><i class="fas fa-eye"></i> Mostrar</button>
    </div>

    
    <div class="botones-edicion">
      <button class="btn-editar"><i class="fas fa-pencil-alt"></i> Editar</button>
      <button class="btn-guardar"><i class="fas fa-save"></i> Guardar</button>
      <button class="btn-deshacer"><i class="fas fa-undo"></i> Deshacer</button>
      <button class="btn-salir"><i class="fas fa-sign-out-alt"></i> Salir</button>
    </div>

  </div>
</body>
</html>
